<script>

    let segundos = 0;

    function atualizarCronometro() {
        segundos++;

        const minutos = Math.floor(segundos / 60);
        const restoSegundos = segundos % 60;

        const formato = 
        String(minutos).padStart(2, '0') + ':' + 
        String(restoSegundos).padStart(2, '0');

        document.getElementById('tempoSessao').textContent = formato;
    }

    setInterval(atualizarCronometro, 1000);





    document.getElementById('sendBtn1').addEventListener('click', function(event) {
        event.preventDefault();

        const nome1 = document.getElementById('input-nome1').value;
        const email1 = document.getElementById('input-email1').value;
        const telefone1 = document.getElementById('input-telefone1').value;
        const relacao1 = document.getElementById('input-relacao1').value;

        

        var pessoa1 = JSON.stringify({
            "nome1": nome1,
            "email1": email1,
            "telefone1": telefone1,
            "relacao1": relacao1
        });


        localStorage.setItem('pessoa1', pessoa1)

        console.log('Pessoa cadastrada no localStorage:', pessoa1);
        alert("Pessoa cadastrada!");

    });

    // Alterar
    document.getElementById('updateBtn1').addEventListener('click', function(event) {
        event.preventDefault();

        if (!localStorage.getItem('pessoa1')) {
            alert("Nenhum cadastro encontrado para alterar.");
            return;
        }

        const nome1 = document.getElementById('input-nome1').value;
        const email1 = document.getElementById('input-email1').value;
        const telefone1 = document.getElementById('input-telefone1').value;
        const relacao1 = document.getElementById('input-relacao1').value;

        const novaPessoa = JSON.stringify({
            nome1: nome1,
            email1: email1,
            telefone1: telefone1,
            relacao1: relacao1
        });

        localStorage.setItem('pessoa1', novaPessoa);
        alert("Dados atualizados com sucesso!");
    });


    // Excluir
    document.getElementById('deleteBtn1').addEventListener('click', function(event) {
        event.preventDefault();

        if (!localStorage.getItem('pessoa1')) {
            alert("Nenhum cadastro encontrado para excluir.");
            return;
        }

        localStorage.removeItem('pessoa1');

        // Limpar campos do formulário
        document.getElementById('input-nome1').value = '';
        document.getElementById('input-email1').value = '';
        document.getElementById('input-telefone1').value = '';
        document.getElementById('input-relacao1').value = '';

        alert("Cadastro excluído!");
    });



    window.addEventListener('DOMContentLoaded', function() {
        const pessoaSalva = localStorage.getItem('pessoa1');
        if (pessoaSalva) {
            const pessoa = JSON.parse(pessoaSalva);
            document.getElementById('input-nome1').value = pessoa.nome1;
            document.getElementById('input-email1').value = pessoa.email1;
            document.getElementById('input-telefone1').value = pessoa.telefone1;
            document.getElementById('input-relacao1').value = pessoa.relacao1;
        }
    });
